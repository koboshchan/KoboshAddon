name: Build WurstAddon

on: [ push, pull_request ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
        fetch-depth: 0

    # checkout already restores the exact gitlink. Never replace it with a
    # moving branch (or a PR's untrusted ref_name).
    - name: Verify pinned Wurst7 dependency
      run: |
        expected="$(git rev-parse HEAD:wurst7-base)"
        actual="$(git -C wurst7-base rev-parse HEAD)"
        test "$actual" = "$expected"
        echo "Wurst7 dependency $actual"

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Build Wurst7 (submodule)
      run: |
        cd wurst7-base
        chmod +x gradlew
        ./gradlew --no-daemon build -x test
        cd ..

    - name: Build WurstAddon
      run: |
        chmod +x gradlew
        ./gradlew --no-daemon clean build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.repository.name }}-build
        path: |
          build/libs/*.jar
          wurst7-base/build/libs/*.jar
        retention-days: 30
        if-no-files-found: error

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          build/libs/*.jar
          wurst7-base/build/libs/*.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
