name: Build WurstAddon

on: [ push, pull_request ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Checkout Wurst7 correct branch
      run: |
        cd wurst7-base
        git fetch origin
        git checkout ${{ github.ref_name }} || echo "Branch not found in submodule, staying on default."
        cd ..

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Build Wurst7 (submodule)
      run: |
        cd wurst7-base
        chmod +x gradlew
        ./gradlew build -x test
        cd ..

    - name: Build WurstAddon
      run: |
        chmod +x gradlew
        ./gradlew build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.repository.name }}-build
        path: |
          build/libs/*.jar
          wurst7-base/build/libs/*.jar
        retention-days: 30

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          build/libs/*.jar
          wurst7-base/build/libs/*.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
